# ===================================================================
# Amazon Sales Management - Standalone In-Memory H2 Configuration
# ===================================================================
server.port=8080
spring.application.name=amazon-sales-management

spring.datasource.url=jdbc:h2:mem:ecommerce_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# DDL / DML Initialization
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.sql.init.schema-locations=classpath:schema-h2.sql
spring.sql.init.data-locations=classpath:data-postgres.sql

# Actuator & Logging
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
logging.level.root=INFO
logging.level.com.amazon.sales=INFO
