# ===================================================================
# Main Application Configuration (PostgreSQL Profile / Default)
# ===================================================================
server.port=8080
server.servlet.context-path=/
spring.application.name=ecommerce-order-management

# PostgreSQL DataSource Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommercedb
spring.datasource.username=postgres
spring.datasource.password=0123git 
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=EcommerceHikariPool

# SQL DDL & DML Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-postgres.sql
spring.sql.init.data-locations=classpath:data-postgres.sql
spring.sql.init.continue-on-error=false

# Domain Business Properties (@Value Injection)
ecommerce.app.store-name=Apex Global E-Commerce
ecommerce.app.tax-rate=0.08
ecommerce.app.free-shipping-threshold=100.00
ecommerce.app.max-order-items=50

# Async Thread Pool Settings
ecommerce.async.core-pool-size=4
ecommerce.async.max-pool-size=8
ecommerce.async.queue-capacity=100

# Actuator Health & Metrics
management.endpoints.web.exposure.include=health,info,metrics

# Logging
logging.level.root=INFO
logging.level.com.ecommerce=DEBUG